name: Release archectl

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: infra/workspace-image/workspace-agent/go.mod

      - name: Build archectl
        working-directory: infra/one-click
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o "../../archectl_${GOOS}_${GOARCH}" .

      - name: Attest binary provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: archectl_${{ matrix.goos }}_${{ matrix.goarch }}

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSET: archectl_${{ matrix.goos }}_${{ matrix.goarch }}
        run: |
          sha256sum "$ASSET" > "$ASSET.sha256"
          gh release upload "$RELEASE_TAG" "$ASSET" "$ASSET.sha256" --clobber

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archectl_${{ matrix.goos }}_${{ matrix.goarch }}
          path: archectl_${{ matrix.goos }}_${{ matrix.goarch }}
