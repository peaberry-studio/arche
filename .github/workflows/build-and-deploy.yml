name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  build-web:
    uses: ./.github/workflows/build-push.yml
    secrets: inherit

  build-workspace:
    uses: ./.github/workflows/build-push-workspace.yml
    secrets: inherit

  deploy:
    needs: [build-web, build-workspace]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Install Ansible
        run: |
          pip install --require-hashes -r infra/deploy/requirements.txt
          ansible-galaxy collection install -r infra/deploy/collections.yml

      - name: Set up SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_KNOWN_HOSTS" || { echo 'VPS_KNOWN_HOSTS must contain the independently verified host key' >&2; exit 1; }
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ARCHE_SESSION_PEPPER: ${{ secrets.ARCHE_SESSION_PEPPER }}
          ARCHE_ENCRYPTION_KEY: ${{ secrets.ARCHE_ENCRYPTION_KEY }}
          ARCHE_INTERNAL_TOKEN: ${{ secrets.ARCHE_INTERNAL_TOKEN }}
          ARCHE_CONNECTOR_OAUTH_STATE_SECRET: ${{ secrets.ARCHE_CONNECTOR_OAUTH_STATE_SECRET }}
          ARCHE_GATEWAY_TOKEN_SECRET: ${{ secrets.ARCHE_GATEWAY_TOKEN_SECRET }}
          ARCHE_SEED_ADMIN_EMAIL: ${{ secrets.ARCHE_SEED_ADMIN_EMAIL }}
          ARCHE_SEED_ADMIN_PASSWORD: ${{ secrets.ARCHE_SEED_ADMIN_PASSWORD }}
          ARCHE_SEED_ADMIN_SLUG: ${{ secrets.ARCHE_SEED_ADMIN_SLUG }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_DOMAIN: ${{ secrets.VPS_DOMAIN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          export OPENCODE_IMAGE="ghcr.io/peaberry-studio/arche/workspace:$(git rev-parse --short HEAD)"
          USER_FLAG=()
          if [[ -n "${VPS_USER}" ]]; then
            USER_FLAG=(--user "${VPS_USER}")
          fi

          cd infra/deploy
          ./deploy.sh \
            --ip "$VPS_HOST" \
            --domain "$VPS_DOMAIN" \
            --ssh-key ~/.ssh/deploy_key \
            --acme-email "$ACME_EMAIL" \
            "${USER_FLAG[@]}" \
            --version "$(git rev-parse --short HEAD)" \
            --skip-ensure-dns-record
