minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
allowBuilds:
  # Prisma engines are required by prisma generate and runtime clients.
  '@prisma/engines': true
  # Native password hashing binding used by authentication.
  argon2: true
  # Native SQLite binding used by the Prisma desktop adapter.
  better-sqlite3: true
  # Optional native CPU capability probe for ssh2; app Docker access does not use SSH.
  cpu-features: false
  # Bundled binary used by TypeScript/runtime tooling.
  esbuild: true
  # Prisma CLI postinstall/generate flow requires its build scripts.
  prisma: true
  # protobufjs postinstall only prints version-scheme guidance.
  protobufjs: false
  # Next image optimization uses sharp at runtime through next/image.
  sharp: true
  # Docker integration uses the local socket/proxy path, not Docker-over-SSH.
  ssh2: false
  # ESLint's TypeScript import resolver uses this native resolver.
  unrs-resolver: true
supportedArchitectures:
  os:
    - current
    - darwin
  cpu:
    - current
    - x64
    - arm64
overrides:
  # Advisory lists fix as 4.17.24 (never published); lodash shipped 4.18.x instead.
  lodash: 4.18.1
  tar: 7.5.11
  hono: 4.12.18
  '@hono/node-server': 1.19.13
  protobufjs: 7.5.8
  '@protobufjs/utf8': 1.1.1
  axios: 1.16.0
  defu: 6.1.5
  flatted: 3.4.2
  qs: 6.15.2
  ws: 8.20.1
  postcss: 8.5.10
  vite: 7.3.2
  undici: 7.27.0
  rollup: 4.61.0
  effect: 3.21.2
  'ajv@6': 6.14.0
  # dockerode pulls uuid@10 (no patched 10.x); 11.1.1 is API-compatible.
  uuid: 11.1.1
  'minimatch@3': 3.1.4
  'picomatch@4': 4.0.4
  'brace-expansion@1': 1.1.13
  'brace-expansion@2': 2.0.3
  'brace-expansion@5': 5.0.6
