minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
allowBuilds:
  # Prisma engines are required by prisma generate and runtime clients.
  '@prisma/engines': true
  # Native password hashing binding used by authentication.
  argon2: true
  # Native SQLite binding used by the Prisma desktop adapter.
  better-sqlite3: true
  # Legacy Paged.js polyfill postinstall scripts are not required at runtime.
  core-js: false
  # Optional native CPU capability probe for ssh2; app Docker access does not use SSH.
  cpu-features: false
  es5-ext: false
  # Bundled binary used by TypeScript/runtime tooling.
  esbuild: true
  # Prisma CLI postinstall/generate flow requires its build scripts.
  prisma: true
  # protobufjs postinstall only prints version-scheme guidance.
  protobufjs: false
  # Next image optimization uses sharp at runtime through next/image.
  sharp: true
  # Docker integration uses the local socket/proxy path, not Docker-over-SSH.
  ssh2: false
  # ESLint's TypeScript import resolver uses this native resolver.
  unrs-resolver: true
supportedArchitectures:
  os:
    - current
    - darwin
  cpu:
    - current
    - x64
    - arm64
overrides:
  # Advisory lists fix as 4.17.24 (never published); lodash shipped 4.18.x instead.
  lodash: 4.18.1
  tar: 7.5.21
  hono: 4.13.11
  '@hono/node-server': 1.19.15
  protobufjs: 7.6.5
  '@protobufjs/utf8': 1.1.1
  axios: 1.20.0
  defu: 6.1.5
  flatted: 3.4.2
  qs: 6.16.0
  ws: 8.21.0
  postcss: 8.5.23
  vite: 7.3.2
  undici: 7.29.1
  rollup: 4.61.0
  effect: 3.21.2
  'ajv@6': 6.14.0
  # dockerode pulls uuid@10 (no patched 10.x); 11.1.1 is API-compatible.
  uuid: 11.1.1
  'minimatch@3': 3.1.4
  'picomatch@4': 4.0.4
  'brace-expansion@1': 1.1.21
  'brace-expansion@2': 2.0.3
  'brace-expansion@5': 5.0.6
  '@grpc/grpc-js': 1.14.5
  'form-data': 4.0.6
  '@babel/core': 7.29.7
  'body-parser': 2.3.0
  'valibot': 1.4.2
  'deepmerge-ts': 8.0.0
  'browserslist': 4.28.7
  'mysql2': 3.23.1
  'baseline-browser-mapping': 2.11.0
  'katex': 0.18.2
  'source-map-js': 1.2.2
  'proxy-addr': 2.0.8
  'prosemirror-view': 1.42.3
  'follow-redirects': 1.16.1
